{{- if eq .Values.secrets.mode "create" }}
{{- $catalogs := default (list) .Values.secrets.catalogs }}
{{- $apiCount := 0 }}
{{- $jwtCount := 0 }}
{{- range $catalog := $catalogs }}
{{- if (default true $catalog.enabled) }}
{{- $apiCount = add $apiCount (len (default (list) $catalog.apiKeys)) }}
{{- $jwtSecrets := default (list) $catalog.jwtSecrets }}
{{- $jwtCount = add $jwtCount (len $jwtSecrets) }}
{{- end }}
{{- end }}
{{- if or (eq $apiCount 0) (eq $jwtCount 0) }}
{{- fail "enabled secrets.catalogs entries must provide at least one api key and one jwt secret when secrets.mode=create" }}
{{- end }}
{{- $apiKeysKey := default "api_keys.txt" .Values.secrets.keys.apiKeys }}
{{- $jwtSecretsKey := default "jwt_hs256_secrets.txt" .Values.secrets.keys.jwtSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecretName }}
  labels:
{{ include "lm-serve-auth.labels" . | indent 4 }}
type: Opaque
stringData:
  {{ $apiKeysKey }}: |
{{- range $catalog := $catalogs }}
{{- if (default true $catalog.enabled) }}
{{- range $catalog.apiKeys }}
    {{ . }}
{{- end }}
{{- end }}
{{- end }}
  {{ $jwtSecretsKey }}: |
{{- range $catalog := $catalogs }}
{{- if (default true $catalog.enabled) }}
{{- range $catalog.jwtSecrets }}
    {{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

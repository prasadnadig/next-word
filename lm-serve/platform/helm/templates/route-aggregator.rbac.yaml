{{- if .Values.routeConfig.liveUpdate.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.routeConfig.liveUpdate.serviceAccountName }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-route-aggregator-configmap-reader" .Release.Name }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
{{- range .Values.routeConfig.liveUpdate.sourceConfigMapNames }}
      - {{ . | quote }}
{{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-route-aggregator-configmap-reader" .Release.Name }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-route-aggregator-configmap-reader" .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.routeConfig.liveUpdate.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-route-aggregator-writer" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-route-aggregator-writer" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-route-aggregator-writer" .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.routeConfig.liveUpdate.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}

# Apply after replacing placeholder values.
# Keep these credentials least-privileged and rotate regularly.

apiVersion: v1
kind: Secret
metadata:
  name: lm-serve-object-storage-creds
  namespace: lm-serve
type: Opaque
stringData:
  access_key_id: REPLACE_ME_ACCESS_KEY
  secret_access_key: REPLACE_ME_SECRET_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: lm-serve-auth-secrets
  namespace: lm-serve
type: Opaque
stringData:
  # One API key per line for small-team bootstrap.
  api_keys.txt: |
    REPLACE_ME_API_KEY_1
    REPLACE_ME_API_KEY_2
  # One HS256 secret per line for test JWT validation.
  jwt_hs256_secrets.txt: |
    REPLACE_ME_LONG_RANDOM_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: lm-serve-hf-credentials
  namespace: lm-serve
type: Opaque
stringData:
  HF_TOKEN: REPLACE_ME_HF_TOKEN

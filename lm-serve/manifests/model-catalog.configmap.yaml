apiVersion: v1
kind: ConfigMap
metadata:
  name: lm-serve-model-catalog
  namespace: lm-serve
data:
  models.yaml: |
    # Cloud-agnostic object storage descriptor. Linode Object Storage is one S3-compatible option.
    storage:
      bucket: REPLACE_ME_BUCKET
      endpoint: https://us-ord-1.linodeobjects.com
      region: us-east-1

    models:
      - name: mistral-7b-instruct
        enabled: true
        source:
          type: huggingface
          repo: mistralai/Mistral-7B-Instruct-v0.3
          revision: main
          authEnv: HF_TOKEN
        storage:
          # Final promoted path is: <prefix>/current/
          # Staged uploads are written under: <prefix>/_staging/<run-id>/
          prefix: models/mistral-7b-instruct
        serving:
          replicas: 1
          gpuCount: 1
          pvcSize: 120Gi
          port: 8000
          tensorParallelSize: 1
          maxModelLen: 8192
          dtype: float16
          image: vllm/vllm-openai:v0.8.5
          # Optional scheduling controls for multi-node GPU placement.
          runtimeClassName: ""
          priorityClassName: ""
          serviceAccountName: ""
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                        - key: lm-serve/model-name
                          operator: In
                          values:
                            - mistral-7b-instruct
          extraArgs:
            - --gpu-memory-utilization
            - "0.9"

      - name: llama-3-1-8b-instruct
        enabled: false
        source:
          type: huggingface
          repo: meta-llama/Llama-3.1-8B-Instruct
          revision: main
          authEnv: HF_TOKEN
        storage:
          prefix: models/llama-3-1-8b-instruct
        serving:
          replicas: 1
          gpuCount: 1
          pvcSize: 150Gi
          port: 8000
          tensorParallelSize: 1
          maxModelLen: 8192
          dtype: float16
          image: vllm/vllm-openai:v0.8.5
          extraArgs: []

# Runs the model-publisher image on a schedule to download HF model artifacts,
# stage them under /tmp (unbounded emptyDir, sized by node disk), upload them
# to shared object storage, and publish per-tenant catalogs for enabled consumers.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.publisher.name }}
  labels:
{{ include "lm-serve-publisher.labels" . | indent 4 }}
spec:
  schedule: {{ .Values.publisher.schedule | quote }}
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 12
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.publisher.serviceAccountName }}
          containers:
            - name: model-publisher
              image: "{{ .Values.publisher.image.registry }}{{ if .Values.publisher.image.registry }}/{{ end }}{{ .Values.publisher.image.repository }}:{{ .Values.publisher.image.tag }}"
              imagePullPolicy: {{ .Values.publisher.image.pullPolicy | quote }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              args:
                - --catalog-namespace
                - {{ .Release.Namespace }}
                - --global-catalog-configmap
                - {{ .Values.publisher.globalCatalogConfigMapName }}
                - --global-catalog-key
                - {{ .Values.publisher.globalCatalogKey | quote }}
                - --catalog-key
                - {{ .Values.publisher.catalogKey }}
                - --storage-bucket
                - {{ required "publisher.storage.bucket is required" .Values.publisher.storage.bucket | quote }}
                - --storage-endpoint
                - {{ required "publisher.storage.endpoint is required" .Values.publisher.storage.endpoint | quote }}
                - --storage-region
                - {{ required "publisher.storage.region is required" .Values.publisher.storage.region | quote }}
                - --published-catalogs-prefix
                - {{ .Values.publisher.publishedCatalogsPrefix | quote }}
                - --published-catalog-key
                - {{ .Values.publisher.publishedCatalogKey | quote }}
                - --shared-artifacts-prefix
                - {{ .Values.publisher.sharedArtifactsPrefix | quote }}
                {{- $enabledCatalogs := list }}
                {{- range .Values.consumer.catalogs }}
                {{- if (default true .enabled) }}
                {{- $enabledCatalogs = append $enabledCatalogs . }}
                {{- end }}
                {{- end }}
                {{- if not $enabledCatalogs }}
                {{- fail "lm-serve-publisher: consumer.catalogs must include at least one enabled tenant for publisher CronJob args" }}
                {{- end }}
                {{- range $enabledCatalogs }}
                - --catalog-configmap
                - {{ $.Values.publisher.catalogConfigMapPrefix }}-{{ .tenant }}
                - --catalog-tenant
                - {{ .tenant | quote }}
                {{- end }}
                {{- range .Values.publisher.forceRedownload }}
                - --force-redownload
                - {{ . | quote }}
                {{- end }}
              env:
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.publisher.credentials.s3SecretNameA }}
                      key: access_key_id
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.publisher.credentials.s3SecretNameA }}
                      key: secret_access_key
                - name: S3_ACCESS_KEY_ID_B
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.publisher.credentials.s3SecretNameB }}
                      key: access_key_id
                - name: S3_SECRET_ACCESS_KEY_B
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.publisher.credentials.s3SecretNameB }}
                      key: secret_access_key
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.publisher.credentials.hfSecretName }}
                      key: HF_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}

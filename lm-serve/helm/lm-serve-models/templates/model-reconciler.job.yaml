{{- if .Values.modelReconciler.enabled }}
{{- $routeEnvSegment := .Release.Namespace -}}
{{- $aliasMap := .Values.routeConfig.namespaceTenantSegmentMap | default dict -}}
{{- if hasKey $aliasMap .Release.Namespace -}}
{{- $routeEnvSegment = index $aliasMap .Release.Namespace -}}
{{- end -}}
{{- $routeEnvSegment = regexReplaceAll "[^a-z0-9-]+" (lower $routeEnvSegment) "-" -}}
{{- $routeEnvSegment = regexReplaceAll "^-+" $routeEnvSegment "" -}}
{{- $routeEnvSegment = regexReplaceAll "-+$" $routeEnvSegment "" -}}
{{- if eq $routeEnvSegment "" -}}
{{- fail "routeConfig namespaceTenantSegmentMap produced an empty tenant segment" -}}
{{- end -}}
{{- if eq (trim .Values.catalog.tenant) "" -}}
{{- fail "catalog.tenant must be set for object-storage catalog pull mode" -}}
{{- end -}}
{{- if eq (trim .Values.catalog.publishedPrefix) "" -}}
{{- fail "catalog.publishedPrefix must be set for object-storage catalog pull mode" -}}
{{- end -}}
{{- if and .Values.modelReconciler.objectStoragePullSecrets.enabled (eq (trim .Values.modelReconciler.objectStoragePullSecrets.secretNameA) "") -}}
{{- fail "modelReconciler.objectStoragePullSecrets.secretNameA must be set when objectStoragePullSecrets.enabled=true" -}}
{{- end -}}
{{- if and .Values.modelReconciler.objectStoragePullSecrets.enabled (eq (trim .Values.modelReconciler.objectStoragePullSecrets.secretNameB) "") -}}
{{- fail "modelReconciler.objectStoragePullSecrets.secretNameB must be set when objectStoragePullSecrets.enabled=true" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.modelReconciler.serviceAccountName }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.modelReconciler.roleName }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.modelReconciler.roleName }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.modelReconciler.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.modelReconciler.roleName }}
{{- if .Values.modelReconciler.objectStoragePullSecrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.modelReconciler.objectStoragePullSecrets.secretNameA }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
    app.kubernetes.io/component: object-storage-pull
    app.kubernetes.io/role: key-a
type: Opaque
stringData:
  access_key_id: {{ .Values.modelReconciler.objectStoragePullSecrets.placeholderValue | quote }}
  secret_access_key: {{ .Values.modelReconciler.objectStoragePullSecrets.placeholderValue | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.modelReconciler.objectStoragePullSecrets.secretNameB }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
    app.kubernetes.io/component: object-storage-pull
    app.kubernetes.io/role: key-b
type: Opaque
stringData:
  access_key_id: {{ .Values.modelReconciler.objectStoragePullSecrets.placeholderValue | quote }}
  secret_access_key: {{ .Values.modelReconciler.objectStoragePullSecrets.placeholderValue | quote }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.modelReconciler.name }}
  labels:
{{ include "lm-serve-models.labels" . | indent 4 }}
spec:
  backoffLimit: {{ .Values.modelReconciler.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.modelReconciler.name }}
{{ include "lm-serve-models.labels" . | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.modelReconciler.serviceAccountName }}
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-reconciler
          image: {{ .Values.modelReconciler.image }}
          imagePullPolicy: {{ .Values.modelReconciler.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args:
            - --namespace
            - {{ .Release.Namespace }}
            - --catalog-storage-bucket
            - {{ .Values.catalog.storage.bucket | quote }}
            - --catalog-storage-endpoint
            - {{ .Values.catalog.storage.endpoint | quote }}
            - --catalog-storage-region
            - {{ .Values.catalog.storage.region | quote }}
            - --catalog-storage-prefix
            - {{ .Values.catalog.publishedPrefix | quote }}
            - --catalog-tenant
            - {{ .Values.catalog.tenant | quote }}
            - --catalog-key
            - {{ .Values.modelReconciler.args.catalogKey }}
            - --route-configmap
            - {{ .Values.modelReconciler.args.routeConfigMapName }}
            - --route-key
            - {{ .Values.modelReconciler.args.routeConfigKey }}
            - --route-tenant-segment
            - {{ $routeEnvSegment | quote }}
            - --model-service-type
            - {{ .Values.modelReconciler.args.modelServiceType }}
            - --watch-interval-sec
            - {{ .Values.modelReconciler.args.watchIntervalSec | quote }}
            - --s3-secret-a
            - {{ .Values.modelReconciler.objectStoragePullSecrets.secretNameA }}
            - --s3-secret-b
            - {{ .Values.modelReconciler.objectStoragePullSecrets.secretNameB }}
            - --s3-secret-placeholder-value
            - {{ .Values.modelReconciler.objectStoragePullSecrets.placeholderValue | quote }}
            - --require-ready-s3-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
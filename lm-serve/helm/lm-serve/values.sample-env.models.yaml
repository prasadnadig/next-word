# Environment model override example.
# Use with:
# helm upgrade --install lm-serve . -n lm-serve \
#   -f values.sample-env.yaml \
#   -f values.sample-env.models.yaml

catalog:
  models:
    - name: mistral-7b-instruct
      enabled: true
      source:
        type: huggingface
        repo: mistralai/Mistral-7B-Instruct-v0.3
        revision: main
        authEnv: HF_TOKEN
      storage:
        prefix: models/mistral-7b-instruct
      serving:
        replicas: 1
        gpuCount: 1
        pvcSize: 120Gi
        port: 8000
        tensorParallelSize: 1
        maxModelLen: 8192
        dtype: float16
        image: vllm/vllm-openai:v0.8.5
        runtimeClassName: ""
        priorityClassName: ""
        serviceAccountName: ""
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: lm-serve/model-name
                        operator: In
                        values:
                          - mistral-7b-instruct
        extraArgs:
          - --gpu-memory-utilization
          - "0.9"

    - name: llama-3-1-8b-instruct
      enabled: false
      source:
        type: huggingface
        repo: meta-llama/Llama-3.1-8B-Instruct
        revision: main
        authEnv: HF_TOKEN
      storage:
        prefix: models/llama-3-1-8b-instruct
      serving:
        replicas: 1
        gpuCount: 1
        pvcSize: 150Gi
        port: 8000
        tensorParallelSize: 1
        maxModelLen: 8192
        dtype: float16
        image: vllm/vllm-openai:v0.8.5
        extraArgs: []

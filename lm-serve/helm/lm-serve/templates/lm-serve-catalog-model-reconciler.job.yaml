{{- if .Values.modelReconciler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.modelReconciler.serviceAccountName }}
  labels:
{{ include "lm-serve.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.modelReconciler.roleName }}
  labels:
{{ include "lm-serve.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.modelReconciler.roleName }}
  labels:
{{ include "lm-serve.labels" . | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.modelReconciler.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.modelReconciler.roleName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.modelReconciler.name }}
  labels:
{{ include "lm-serve.labels" . | indent 4 }}
spec:
  backoffLimit: {{ .Values.modelReconciler.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.modelReconciler.name }}
{{ include "lm-serve.labels" . | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.modelReconciler.serviceAccountName }}
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-reconciler
          image: {{ .Values.modelReconciler.image }}
          imagePullPolicy: {{ .Values.modelReconciler.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args:
            - --namespace
            - {{ .Release.Namespace }}
            - --catalog-configmap
            - {{ .Values.modelReconciler.args.catalogConfigMapName }}
            - --catalog-key
            - {{ .Values.modelReconciler.args.catalogKey }}
            - --edge-service-type
            - {{ .Values.modelReconciler.args.edgeServiceType }}
            - --watch-interval-sec
            - {{ .Values.modelReconciler.args.watchIntervalSec | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

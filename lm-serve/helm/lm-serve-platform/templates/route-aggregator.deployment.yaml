{{- if .Values.routeConfig.liveUpdate.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.routeConfig.liveUpdate.controller.name }}
  labels:
{{ include "lm-serve-platform.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.routeConfig.liveUpdate.controller.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.routeConfig.liveUpdate.controller.name }}
{{ include "lm-serve-platform.labels" . | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.routeConfig.liveUpdate.serviceAccountName }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: route-aggregator
        image: "{{ .Values.routeConfig.liveUpdate.controller.image.repository }}:{{ .Values.routeConfig.liveUpdate.controller.image.tag }}"
        imagePullPolicy: {{ .Values.routeConfig.liveUpdate.controller.image.pullPolicy }}
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: TARGET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: TARGET_CONFIGMAP
            value: {{ printf "%s-config" .Values.envoy.name | quote }}
          - name: ENVOY_DEPLOYMENT
            value: {{ .Values.envoy.name | quote }}
          - name: NAMESPACE_ALLOW_REGEX
            value: {{ .Values.routeConfig.liveUpdate.namespaceAllowRegex | quote }}
          - name: SOURCE_CONFIGMAP_NAMES_JSON
            value: {{ toJson .Values.routeConfig.liveUpdate.sourceConfigMapNames | quote }}
          - name: SOURCE_LABEL_KEY
            value: {{ .Values.routeConfig.liveUpdate.labelKey | quote }}
          - name: SOURCE_LABEL_VALUE
            value: {{ .Values.routeConfig.liveUpdate.labelValue | quote }}
          - name: SOURCE_KEY
            value: {{ .Values.routeConfig.liveUpdate.sourceKey | quote }}
          - name: POLL_INTERVAL_SEC
            value: {{ .Values.routeConfig.liveUpdate.pollIntervalSec | quote }}
          - name: REQUIRE_ANY_SOURCE
            value: {{ .Values.routeConfig.liveUpdate.requireAnySource | quote }}
          - name: AUTHZ_MODE
            value: {{ .Values.authz.mode | quote }}
          - name: AUTHZ_HOST
            value: {{ .Values.authz.endpoint.host | quote }}
          - name: AUTHZ_NAMESPACE
            value: {{ .Values.authz.endpoint.namespace | quote }}
          - name: AUTHZ_PORT
            value: {{ .Values.authz.endpoint.port | quote }}
          - name: AUTHZ_SCHEME
            value: {{ .Values.authz.endpoint.scheme | quote }}
          - name: AUTHZ_PATH_PREFIX
            value: {{ .Values.authz.endpoint.pathPrefix | quote }}
          - name: AUTHZ_TIMEOUT
            value: {{ .Values.authz.endpoint.timeout | quote }}
          - name: AUTHZ_ALLOWED_HEADERS_JSON
            value: {{ toJson .Values.authz.allowedHeaders | quote }}
          - name: ENVOY_TARGET_PORT
            value: {{ .Values.envoy.service.targetPort | quote }}
          - name: ENVOY_HEALTH_PATH
            value: {{ .Values.envoy.health.path | quote }}
          - name: ENVOY_ADMIN_PORT
            value: {{ .Values.envoy.admin.port | quote }}
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}

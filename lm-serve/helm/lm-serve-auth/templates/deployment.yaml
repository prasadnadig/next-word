{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.authService.name }}
  labels:
{{ include "lm-serve-auth.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.authService.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.authService.name }}
{{ include "lm-serve-auth.labels" . | indent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth
        image: {{ .Values.authService.image | quote }}
        imagePullPolicy: {{ .Values.authService.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.authService.service.port }}
          name: http
        env:
        - name: API_KEYS_FILE
          value: {{ printf "/secrets/%s" .Values.secrets.keys.apiKeys | quote }}
        - name: JWT_SECRET_FILE
          value: {{ printf "/secrets/%s" .Values.secrets.keys.jwtSecret | quote }}
        - name: SECRET_RELOAD_INTERVAL_SEC
          value: {{ .Values.authService.secretReloadIntervalSec | quote }}
        volumeMounts:
        - name: auth-secrets
          mountPath: /secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.authService.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.authService.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        resources:
{{ toYaml .Values.authService.resources | indent 10 }}
      volumes:
      - name: auth-secrets
        secret:
          secretName: {{ .Values.secrets.existingSecretName }}
{{- end }}
